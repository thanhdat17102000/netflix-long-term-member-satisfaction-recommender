profile: full
storage_backend: hdfs
local_input_dir: data/input/ml-25m
local_warehouse: data/warehouse/ml25m
hdfs_root: /ml25m
hdfs_namenode: hdfs://namenode:9000
spark_driver_memory: 10g
spark_driver_max_result_size: 4g
seed: 42
long_term_min_days: 180
long_term_min_ratings: 20
positive_rating_threshold: 4.0
min_split_interactions: 3
train_ratio: 0.8
validation_ratio: 0.1
als_rank: 64
als_reg_param: 0.1
als_max_iter: 10
als_top_n: 100
genome_top_k: 64
reranker_max_rows: 2000000
reranker_batch_size: 4096
reranker_epochs: 10
spark_partitions: 200
spark_master: local[*]
